name: Sync Inequivalent solver

on:
  schedule:
    # GitHub may start this late. The run commits only when web/ changed.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [inequivalent-web]

permissions:
  contents: write

concurrency:
  group: sync-inequivalent
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the solver from Inequivalent master
        run: bash scripts/sync-inequivalent.sh

      - name: Commit and push when the copy changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/inequivalent
          if git diff --cached --quiet; then
            echo "Solver already matches Inequivalent master."
            exit 0
          fi
          git commit -m "Sync the inequivalent solver from Inequivalent master."
          git push origin HEAD:main
